name: Update Changelog

on:
  push:
    branches: [main]

jobs:
  changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: orhun/git-cliff-action@v4
        id: cliff
        with:
          config: .cliff.toml
          args: --latest --strip header

      - name: Update CHANGELOG.md
        run: |
          # Get the latest entry
          ENTRY="${{ steps.cliff.outputs.content }}"
          
          if [ -z "$ENTRY" ]; then
            echo "No changes to add to changelog"
            exit 0
          fi
          
          # Read existing changelog
          CONTENT=$(cat CHANGELOG.md)
          
          # Find the line number of "## [Unreleased]" section content
          # and insert the new entry after it
          NEW_CONTENT=$(echo "$CONTENT" | awk -v entry="$ENTRY" '
            /^## \[Unreleased\]/ { 
              print
              getline
              if ($0 != "") print
              print ""
              print entry
              next
            }
            { print }
          ')
          
          echo "$NEW_CONTENT" > CHANGELOG.md

      - name: Commit changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --staged --quiet || git commit -m "docs: update CHANGELOG.md"
          git push
