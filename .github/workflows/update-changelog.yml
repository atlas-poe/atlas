name: Update Changelog

on:
  push:
    branches: [main]

jobs:
  changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@git-cliff

      - name: Generate changelog entry
        id: cliff
        run: |
          CONTENT=$(git-cliff --latest --strip header)
          echo "$CONTENT" > /tmp/cliff-entry.md

      - name: Update CHANGELOG.md
        run: |
          # Use awk to insert the entry under [Unreleased]
          awk '
            /^## \[Unreleased\]/ {
              print
              getline
              if ($0 != "") print
              print ""
              while ((getline line < "/tmp/cliff-entry.md") > 0) {
                print line
              }
              close("/tmp/cliff-entry.md")
              next
            }
            { print }
          ' CHANGELOG.md > /tmp/changelog-new.md
          
          mv /tmp/changelog-new.md CHANGELOG.md

      - name: Commit changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --staged --quiet || git commit -m "docs: update CHANGELOG.md"
          git push
