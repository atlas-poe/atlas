name: Update Changelog

on:
  push:
    branches: [main]

jobs:
  changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@git-cliff

      - name: Generate changelog entry
        run: |
          CONTENT=$(git-cliff --latest --strip header)
          echo "$CONTENT" > /tmp/cliff-entry.md

      - name: Update CHANGELOG.md
        run: |
          awk '
            /^## \[Unreleased\]/ {
              print
              getline
              if ($0 != "") print
              print ""
              while ((getline line < "/tmp/cliff-entry.md") > 0) {
                print line
              }
              close("/tmp/cliff-entry.md")
              next
            }
            { print }
          ' CHANGELOG.md > /tmp/changelog-new.md
          
          mv /tmp/changelog-new.md CHANGELOG.md

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "docs: update CHANGELOG.md"
          title: "docs: update CHANGELOG.md"
          body: "Automated changelog update generated by git-cliff."
          branch: chore/update-changelog
          delete-branch: true
