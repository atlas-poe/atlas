name: Update Changelog

on:
  push:
    branches: [main]

jobs:
  changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: orhun/git-cliff-action@v4
        id: cliff
        with:
          config: .cliff.toml
          args: --latest --strip header

      - name: Update CHANGELOG.md
        if: steps.cliff.outputs.content != ''
        env:
          CLIFF_CONTENT: ${{ steps.cliff.outputs.content }}
        run: |
          # Use env var to avoid shell escaping issues
          echo "$CLIFF_CONTENT" > /tmp/cliff-entry.md
          
          # Use awk to insert the entry under [Unreleased]
          awk '
            /^## \[Unreleased\]/ {
              print
              getline
              if ($0 != "") print
              print ""
              while ((getline line < "/tmp/cliff-entry.md") > 0) {
                print line
              }
              close("/tmp/cliff-entry.md")
              next
            }
            { print }
          ' CHANGELOG.md > /tmp/changelog-new.md
          
          mv /tmp/changelog-new.md CHANGELOG.md

      - name: Commit changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --staged --quiet || git commit -m "docs: update CHANGELOG.md"
          git push
