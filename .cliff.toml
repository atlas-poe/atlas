[changelog]
# changelog configuration
header = """
# Changelog\n
All notable changes to Atlas will be documented in this file.\n
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**BREAKING**] {% endif %}\
            {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}\n
"""
trim = true
footer = """
---
\n
## Release Plan\n
Atlas follows [Semantic Versioning](https://semver.org/spec/v2.0.0.html):\n
- **MAJOR** version for incompatible API changes\n
- **MINOR** version for backwards-compatible functionality\n
- **PATCH** version for backwards-compatible bug fixes\n
Releases are automated using Conventional Commits:\n
- `feat:` commits trigger MINOR version bumps\n
- `fix:` commits trigger PATCH version bumps\n
- `feat!:` or `BREAKING CHANGE:` commits trigger MAJOR version bumps\n
See [CONTRIBUTING.md](CONTRIBUTING.md) for details on the release process.
"""

[git]
# parse the commits based on conventional commits
conventional_commits = true
# regex for parsing and grouping commits
commit_parsers = [
    { message = "^feat", group = "Added" },
    { message = "^fix", group = "Fixed" },
    { message = "^doc", group = "Documentation" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Changed" },
    { message = "^style", group = "Changed" },
    { message = "^chore", group = "Changed" },
    { message = "^test", group = "Testing" },
    { message = "^ci", group = "CI/CD" },
    { message = "^revert", group = "Reverted" },
    { message = ".*", group = "Other" },
]
# filter out certain commits
filter_unconventional = true
# process each line of a commit as an individual commit
split_commits = false
# regex for matching and parsing tags
tag_pattern = "v[0-9].*"
# sort tags by date
sort_commits = "oldest"
